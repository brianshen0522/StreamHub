map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# The protocol the person actually used. This container only ever hears
# plain http — TLS terminates at whatever reverse proxy sits in front — so
# writing our own $scheme here overwrote the proxy's "https" and the server
# built http:// URLs (the QR code's verification link among them). Pass the
# upstream's word through and speak for ourselves only when nobody in front
# said anything.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

map $http_origin $cors_origin {
  default "";
  "~^https?://localhost(:[0-9]+)?$" "$http_origin";
  "~^https?://127\.0\.0\.1(:[0-9]+)?$" "$http_origin";
  "~^https?://${PUBLIC_DOMAIN}$" "$http_origin";
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Hashed build artifacts: the name changes whenever the bytes do, so these
  # may be cached forever and never revalidated.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # CORS preflight
  location / {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin  $cors_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
      add_header Access-Control-Max-Age       86400 always;
      add_header Content-Length 0;
      return 204;
    }

    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;

    # The shell must revalidate on every open. With no Cache-Control at all,
    # browsers guess a lifetime off Last-Modified — and an iPhone home-screen
    # app kept running a stale bundle through several deploys, which surfaced
    # as fixes that "did nothing" on the phone while every byte on the server
    # was current.
    add_header Cache-Control "no-cache" always;

    try_files $uri /index.html;
  }

  location /api/ {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin  $cors_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
      add_header Access-Control-Max-Age       86400 always;
      add_header Content-Length 0;
      return 204;
    }

    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;

    proxy_pass http://server:8787/api/;
    proxy_http_version 1.1;

    # /api/realtime is a WebSocket; without these the upgrade is swallowed.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# The protocol the person actually used. This container only ever hears
# plain http — TLS terminates at whatever reverse proxy sits in front — so
# writing our own $scheme here overwrote the proxy's "https" and the server
# built http:// URLs (the QR code's verification link among them). Pass the
# upstream's word through and speak for ourselves only when nobody in front
# said anything.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

map $http_origin $cors_origin {
  default "";
  "~^https?://localhost(:[0-9]+)?$" "$http_origin";
  "~^https?://127\.0\.0\.1(:[0-9]+)?$" "$http_origin";
  # Plain strings rather than a pattern: a dot in a pattern matches any
  # character, which would admit a differently spelled domain.
  "https://${PUBLIC_DOMAIN}" "$http_origin";
  "http://${PUBLIC_DOMAIN}" "$http_origin";
}

# The API alone also answers packaged clients. A Tizen web app runs from its
# own package, so its requests carry "file://", "null" or "app://<id>" as the
# origin, never a domain. Admitting those is safe here because nothing on
# /api/ authenticates by cookie: every route wants a bearer token the caller
# already holds, and Access-Control-Allow-Credentials is never sent, so a page
# that happens to share one of these origins gains nothing it did not have.
map $http_origin $api_cors_origin {
  default $cors_origin;
  "null" "null";
  "file://" "file://";
  "~^app://[A-Za-z0-9._-]+$" "$http_origin";
}

# Media URLs carry an access token in the query string, and an access log is
# not somewhere a credential should end up.
map $request_uri $loggable_uri {
  default $request_uri;
  "~^(?<uri_head>.*[?&]accessToken=)[^&]*(?<uri_tail>.*)$" "${uri_head}redacted${uri_tail}";
}

log_format redacted '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $loggable_uri $server_protocol" $status '
                    '$body_bytes_sent "$http_referer" "$http_user_agent"';

server {
  listen 80;
  server_name _;
  server_tokens off;
  access_log /var/log/nginx/access.log redacted;

  root /usr/share/nginx/html;
  index index.html;

  # Hashed build artifacts: the name changes whenever the bytes do, so these
  # may be cached forever and never revalidated.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # CORS preflight
  location / {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin  $cors_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
      add_header Access-Control-Max-Age       86400 always;
      add_header Content-Length 0;
      return 204;
    }

    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;

    # The shell must revalidate on every open. With no Cache-Control at all,
    # browsers guess a lifetime off Last-Modified — and an iPhone home-screen
    # app kept running a stale bundle through several deploys, which surfaced
    # as fixes that "did nothing" on the phone while every byte on the server
    # was current.
    add_header Cache-Control "no-cache" always;

    # add_header does not inherit into a location that sets its own, so these
    # live here. The sources stay wide because media and posters come straight
    # from whichever CDN a provider uses; scripts are what this is for.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; media-src 'self' blob: https: http:; connect-src 'self' https: http: ws: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    try_files $uri /index.html;
  }

  location /api/ {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin  $api_cors_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-StreamHub-Client" always;
      add_header Access-Control-Max-Age       86400 always;
      add_header Vary Origin always;
      add_header Content-Length 0;
      return 204;
    }

    # PUT /me/progress and the DELETEs (favorites, progress, sessions) were
    # missing, which no same-origin page notices and every packaged client
    # fails on; X-StreamHub-Client is sent by every native client. The exposed
    # headers are the ones the contract tells clients to read.
    add_header Access-Control-Allow-Origin  $api_cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-StreamHub-Client" always;
    add_header Access-Control-Expose-Headers "Retry-After, X-Adfilter-Removed-Seconds, X-Adfilter-Reason" always;
    add_header Vary Origin always;

    proxy_pass http://server:8787/api/;
    proxy_http_version 1.1;

    # /api/realtime is a WebSocket; without these the upgrade is swallowed.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }
}

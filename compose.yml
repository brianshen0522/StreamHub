services:
  postgres:
    image: postgres:17-alpine
    container_name: streamhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-streamhub}
      POSTGRES_USER: ${POSTGRES_USER:-streamhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streamhub}
    # Reachable from the other containers over the compose network, and from
    # nowhere else. It used to be published on every interface, which on a host
    # that is about to answer on a public domain means the database is too.
    # For a psql session from the host: docker compose exec postgres psql -U streamhub
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  server:
    build:
      # Root context so shared/ is available to the image.
      context: .
      dockerfile: server/Dockerfile
    container_name: streamhub-server
    # Fetches and parses whatever remote hosts send, and needs no capabilities
    # to do it: it runs as node on an unprivileged port.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ./.env
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-streamhub}:${POSTGRES_PASSWORD:-streamhub}@postgres:5432/${POSTGRES_DB:-streamhub}?schema=public
    # Loopback by default: nginx reaches this over the compose network. Published
    # on every interface, a caller could skip nginx and write its own
    # X-Forwarded-For, which is what the rate limiter keys on. Set
    # SERVER_BIND_ADDRESS if something on another host has to reach it directly.
    ports:
      - "${SERVER_BIND_ADDRESS:-127.0.0.1}:8787:8787"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: streamhub-frontend
    depends_on:
      - server
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-localhost}

volumes:
  postgres-data:

    </clipPath>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="28.16"
                    flood-color="#FF2733" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g clip-path="url(#tileShape)">
    <rect width="1024" height="1024" fill="url(#tile)"/>
    <rect width="1024" height="1024" fill="url(#light)"/>
    <g transform="translate(512 512) rotate(-34.6)">
          <rect x="-1024" y="-307.20" width="2048" height="117.76" rx="58.88" fill="url(#stream)"/>
        <rect x="-1024" y="204.80" width="2048" height="56.32" rx="28.16" fill="url(#stream)"/>
    </g>
  </g>
  <path d="M368.67,351.26 A48,48 0 0 1 440.28,309.47 L724.72,470.21 A48,48 0 0 1 724.72,553.79 L440.28,714.53 A48,48 0 0 1 368.67,672.74 Z" fill="url(#mark)" filter="url(#glow)"/>
</svg>

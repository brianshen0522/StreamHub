[workspace]
resolver = "2"
members = ["core", "app"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# The monitor's CPU compiles the module on every launch, so size is startup time.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

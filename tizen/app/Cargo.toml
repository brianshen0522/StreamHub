[package]
name = "streamhub-tizen"
edition.workspace = true
version.workspace = true

[dependencies]
streamhub-core = { path = "../core" }
leptos = { version = "0.8", features = ["csr"] }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
futures = "0.3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "DomRect", "Storage",
  "KeyboardEvent", "Event", "EventTarget", "Location", "Navigator",
  "Request", "RequestInit", "RequestMode", "Response", "Headers",
  "ReadableStream", "ReadableStreamDefaultReader", "TextDecoder", "TextDecodeOptions",
  "WebSocket", "MessageEvent", "CloseEvent", "BinaryType",
  "HtmlInputElement", "ScrollIntoViewOptions", "ScrollBehavior", "ScrollLogicalPosition",
  "AbortController", "AbortSignal", "console",
] }

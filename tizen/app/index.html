<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>StreamHub</title>
  <link data-trunk rel="css" href="assets/styles.css">
  <link data-trunk rel="copy-dir" href="js">
  <!-- Classic scripts, loaded before the module: Tizen's ES-module support is
       only "partial", and the player shim must exist before Rust calls it. -->
  <script src="js/tizen-keys.js"></script>
  <script src="js/player-shim.js"></script>
  <!-- The monitor (S32FM703UC, 2025, Tizen 9 / Chromium M120) has every
       post-MVP feature Rust emits by default; wasm-opt must be told so. -->
  <link data-trunk rel="rust" data-wasm-opt="z" data-bin="streamhub-tizen"
        data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-reference-types --enable-multivalue --enable-mutable-globals">
</head>
<body></body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>StreamHub</title>
  <link data-trunk rel="css" href="assets/base.css" data-integrity="none">
  <link data-trunk rel="css" href="assets/styles.css" data-integrity="none">
  <link data-trunk rel="css" href="assets/player.css" data-integrity="none">
  <link data-trunk rel="copy-dir" href="js">
  <!-- Classic scripts, loaded before the module: Tizen's ES-module support is
       only "partial", and the player shim must exist before Rust calls it. -->
  <!-- Samsung's product APIs (webapis.avplay, productinfo). Resolved by the
       TV's web runtime; a desktop browser 404s it, and every caller guards on
       `typeof webapis`. Must come before player-shim.js. -->
  <script src="$WEBAPIS/webapis/webapis.js"></script>
  <script src="js/boot.js"></script>
  <script src="js/tizen-keys.js"></script>
  <script src="js/player-shim.js"></script>
  <!-- Must match build.sh's wasm32 target features: the oldest supported set
       is Chromium 85 (LS32BM703UC, 2022, Tizen 6.5), which has no
       reference-types or multivalue. -->
  <!-- no-modules + our own loader below, instead of trunk's injected
       module script: Chromium refuses module scripts from file://
       (their origin is "null"), which is where a packaged widget runs. -->
  <link data-trunk rel="rust" data-wasm-opt="z" data-bin="streamhub-tizen" data-integrity="none"
        data-bindgen-target="no-modules" data-wasm-no-import
        data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals">
</head>
<body>
  <script src="streamhub-tizen.js"></script>
  <script src="js/start.js"></script>
</body>
</html>
